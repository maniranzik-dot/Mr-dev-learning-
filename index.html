<script>
document.addEventListener("DOMContentLoaded", () => {
  // Remove visible HTML/code viewer elements
  document.querySelectorAll(
    "pre, code, .code, .code-block, .source-code, .html-code, #index-html, #index-code"
  ).forEach(el => {
    if (
      el.textContent.includes("<!DOCTYPE html>") ||
      el.textContent.includes("<html") ||
      el.textContent.includes("<body") ||
      el.textContent.includes("index.html")
    ) {
      el.remove();
    }
  });
});
</script>
